name: Ceipal Ticker

on:
  schedule:
    - cron: '*/50 * * * *' # Runs every 50 minutes
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to allow gh-pages to push to the gh-pages branch

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate Fresh Ceipal Token
        id: ceipal-token
        run: |
          RESPONSE=$(curl -s -X POST https://api.ceipal.com/v2/createAuthtoken/ \
            -H 'Content-Type: application/json' \
            -d '{
              "email": "${{ secrets.CEIPAL_EMAIL }}",
              "password": "${{ secrets.CEIPAL_PASSWORD }}",
              "apiKey": "${{ secrets.CEIPAL_API_KEY }}"
            }')
          
          # Extract access_token using jq and safely store it as an output variable
          ACCESS_TOKEN=$(echo $RESPONSE | jq -r .access_token)
          echo "token=$ACCESS_TOKEN" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Build and Push to GitHub Pages
        env:
          NEXT_PUBLIC_CEIPAL_ACCESS_TOKEN: ${{ steps.ceipal-token.outputs.token }}
          GITHUB_PAGES: "true"
        run: npm run deploy
